<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>درسنامه</title>
  <link rel="stylesheet" href="../chapters/css/katex.min.css">
  <link rel="stylesheet" href="../chapters/css/style.css">
  <link rel="stylesheet" href="css/course-base.css">
  <script>
  /* CSS هر فصل یک‌جا و همان ابتدای ورود به صفحه لود می‌شود (نه lazy). فقط CSS همان فصل (?ch=N) و قواعد مشترک؛
     تکه‌های مشترک و فایل فصل دقیقاً به همان ترتیب قدیمیِ فایل‌ها می‌آیند تا cascade تغییر نکند. */
  (function () {
    var ORDER = [2, 1, 'ov', 3, 7, 5, 4, 6];          /* ترتیب اصلی فایل‌ها */
    var SEG = { 2: 1, 1: 1, ov: 1, 3: 1, 7: 1, 5: 1, 4: 1 }; /* فصل‌هایی که تکهٔ مشترک دارند */
    var n = parseInt(new URLSearchParams(location.search).get('ch'), 10) || 1;
    if (n < 1 || n > 7) { n = 1; }
    function add(x) { document.write('<link rel="stylesheet" href="css/' + x + '.css">'); }
    ORDER.forEach(function (k) {
      if (SEG[k]) { add(k === 'ov' ? 'course-shared-overrides' : 'course-shared-ch' + k); }
      if (k === n) { add('ch' + n); }
    });
  })();
  </script>
</head>
<body>
  <main class="page wide">
    <section class="hero">
      <div class="hero-line" id="heroHost" aria-hidden="true"></div>
      <span class="pill">درسنامهٔ فصل <b id="cNum"></b></span>
      <div class="titlebar"><h1 id="cTitle"></h1></div>
      <p class="lead" id="cDesc"></p>
    </section>
    <div class="card start-actions">
      <a class="btn primary big" id="btnExam" href="../chapters/chapter.html?ch=1">آزمون این فصل</a>
      <a class="btn big" href="../index.html">منوی اصلی</a>
    </div>
    <div class="skills-heading">
      <h2 class="listhead">مهارت‌های این فصل <small>روی «+» بزن تا درسنامه‌اش باز شود</small></h2>
      <button type="button" class="skills-toggle-all" id="toggleAllSkills" data-action="open" aria-controls="skills">
        <svg class="toggle-all-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m7 9 5 5 5-5M7 4l5 5 5-5"/></svg>
        <span class="toggle-all-label">باز کردن همه</span>
      </button>
    </div>
    <section id="skills" class="skills"></section>
  </main>
  <script src="../chapters/js/loader.js"></script>
  <script src="../chapters/js/katex.min.js"></script>
  <script src="../chapters/js/math.js"></script>
  <script src="js/core.js"></script>
  <script src="js/mathfit.js"></script>
</body>
</html>
